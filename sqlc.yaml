version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "internal/repository/migrations"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/repository/sqlcdb"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.uuid"
            go_type: "github.com/google/uuid.UUID"
